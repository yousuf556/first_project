<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="home_page.css">
    <link rel="stylesheet" href="game.css">
</head>
<body>

<header class="upper_view">

    <!-- LEFT -->
    <h1 class="page_title">Game</h1>

    <!-- CENTER -->
    <div class="nav_buttons">
        <a href="about_me.html"><button>About Me</button></a>
        <a href="contact.html"><button>Contact</button></a>
        <a href="index.html"><button>Back</button></a>
    </div>

    <!-- RIGHT -->
    <div class="icon_space">

        <div class="search_box">
            <img class="icons" src="search_bar.png">
            <input type="text" placeholder="Search">
        </div>
        <!-- SETTINGS -->
        <div class="settings">
            <img class="icons" src="settings.png">

            <div class="settings_panel">

                <!-- MUSIC -->
                <div class="setting_row">
                    <span>Music</span>
                    <span class="arrow">▶</span>

                    <div class="sub_panel">
                        <p class="music_item">Music 1</p>
                        <p class="music_item">Music 2</p>
                        <p class="music_item">Music 3</p>
                    </div>
                </div>

                <!-- TEMPERATURE -->
                <div class="setting_row">
                    <span>Temperature</span>
                    <span class="arrow">▶</span>

                    <div class="sub_panel">
                        <p class="temp_red">45°C</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

</header>


<!-- GAME GRID -->
<div class="game_section">

    <button id="openbtn">restart</button>
    <div id="modal" class="modal">
            
            <div class="modal-content">

                <span id="closebtn" class="closebtn">&times;</span>
                
                <iframe width="560" height="315" src="https://www.youtube.com/embed/PMH54eetPSo?si=9RYEyTFiDrCNjY-b" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            
    </div>

    <div class="row">
        <div class="ticktackbox" onclick="play(this,0)"></div>
        <div class="ticktackbox" onclick="play(this,1)"></div>
        <div class="ticktackbox" onclick="play(this,2)"></div>
    </div>

    <div class="row">
        <div class="ticktackbox" onclick="play(this,3)"></div>
        <div class="ticktackbox" onclick="play(this,4)"></div>
        <div class="ticktackbox" onclick="play(this,5)"></div>
    </div>

    <div class="row">
        <div class="ticktackbox" onclick="play(this,6)"></div>
        <div class="ticktackbox" onclick="play(this,7)"></div>
        <div class="ticktackbox" onclick="play(this,8)"></div>
    </div>

</div>
<script src="home_page.js"></script>

</body>
</html>
